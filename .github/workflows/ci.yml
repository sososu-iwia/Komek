name: Verify MVP
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: komek
          POSTGRES_PASSWORD: komek_local_only
          POSTGRES_DB: komek
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U komek -d komek"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    env:
      NODE_ENV: development
      DEV_SEED: 'true'
      ALLOWED_EMAIL_DOMAINS: astanait.edu.kz
      DATABASE_URL: postgresql://komek:komek_local_only@localhost:5433/komek?schema=public
      TEST_DATABASE_URL: postgresql://komek:komek_local_only@localhost:5433/komek_test?schema=public
      PGPASSWORD: komek_local_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: psql -h localhost -p 5433 -U komek -d postgres -c 'CREATE DATABASE komek_test'
      - run: npm run db:migrate && npm run db:seed
      - run: DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: |
          npm run dev > /tmp/komek-dev.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:5173/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/komek-dev.log
          exit 1
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-failures
          path: apps/web/cypress/screenshots
