services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: komek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-komek_local_only}
      POSTGRES_DB: komek
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U komek -d komek']
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://komek:${POSTGRES_PASSWORD:-komek_local_only}@db:5432/komek?schema=public
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-astanait.edu.kz}
      SMTP_HOST: ${SMTP_HOST_DOCKER:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Komek Skills <noreply@students.example.test>}
      EMAIL_NOTIFICATIONS: ${EMAIL_NOTIFICATIONS:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEV_SEED: ${DEV_SEED:-true}
      DEMO_CREDENTIALS_PATH: /app/.local/demo-credentials.json
    volumes:
      - demo_credentials:/app/.local
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:5173:80'
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  demo_credentials:
